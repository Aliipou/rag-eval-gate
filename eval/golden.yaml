# Golden evaluation set.
#
# Each case is an independent oracle: `expected_chunk_ids` and
# `expected_behavior` were determined by reading the source PDFs
# directly (see corpus/SOURCES.md), NOT by running the pipeline and
# recording what it happened to do. That is the whole point of a golden
# set -- eval/run_eval.py measures how well the actual system lives up
# to this independently-authored ground truth, so it can regress.
#
# expected_behavior:
#   answer  -- the corpus genuinely contains the information; the system
#              should answer, citing (at least one of) expected_chunk_ids.
#   refuse  -- the corpus does NOT contain the information; the system
#              should say so rather than answer, so expected_chunk_ids is
#              empty.
#
# 48 cases total: 34 "answer" (spanning both source documents) + 14
# "refuse" (genuinely unanswerable from this corpus -- specific figures,
# unrelated law, general knowledge, current events).

